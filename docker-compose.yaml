services:
  app:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - appnet

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=movie_catalog
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  pgdata:
